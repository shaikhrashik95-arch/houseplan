
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eng. CAD Studio Prime</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07162c;color:#eef6ff;font:14px Arial}
header{padding:14px;background:#102d52;font-size:20px;font-weight:bold}
nav,.toolbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px;background:#0b203d}
button,select,input{background:#16385f;color:white;border:1px solid #3973a8;padding:10px;border-radius:6px}
button:active{background:#0787ff}
#status{padding:8px;color:#7ee8b1}
#canvas2d{width:100%;height:55vh;display:block;background:#081a32;touch-action:none}
#view3d{height:55vh;width:100%;display:none}
.panel{padding:10px}
h3{margin:8px 0}
.small{font-size:12px;color:#a9c5e6}
</style>
</head>
<body>
<header>🏠 Eng. CAD Studio Prime</header>
<nav>
<button onclick="showView('2d')">2D CAD</button>
<button onclick="showView('3d')">3D MODEL</button>
<button onclick="undo()">Undo</button>
<button onclick="fit()">Fit Drawing</button>
<button onclick="exportPNG()">PNG Export</button>
<button onclick="saveJSON()">Save JSON</button>
<button onclick="document.getElementById('load').click()">Load JSON</button>
<input id="load" type="file" accept=".json" hidden onchange="loadJSON(event)">
</nav>
<div class="toolbar" id="tools">
<button onclick="setTool('room')">Room</button>
<button onclick="setTool('wall')">Wall</button>
<button onclick="setTool('door')">Door</button>
<button onclick="setTool('window')">Window</button>
<button onclick="setTool('light')">Light</button>
<button onclick="setTool('switch')">Switch</button>
<button onclick="setTool('socket')">Socket</button>
<button onclick="setTool('fan')">Fan</button>
<button onclick="setTool('cabinet')">Cabinet</button>
<button onclick="setTool('bed')">Bed</button>
<button onclick="setTool('stair')">Staircase</button>
<button onclick="setTool('erase')">Delete</button>
</div>
<div class="panel">
<label>Size (drawing units): </label>
<input id="size" type="number" value="100" min="10" max="500" style="width:90px">
<label>Color:</label>
<input id="color" type="color" value="#d5e5ff">
<p class="small">Room: tap and drag to draw. Other tools: tap to place. Door/Window: place near a wall.</p>
</div>
<canvas id="canvas2d"></canvas>
<div id="view3d"></div>
<div id="status">Ready — Select a drawing tool.</div>

<script>
const canvas=document.getElementById('canvas2d');
const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status');
let objects=[],history=[],tool='room',drawing=null;
let scale=1,ox=20,oy=20;
let view='2d',renderer,scene,camera,modelGroup;

function say(t){statusEl.textContent=t}
function setTool(t){tool=t;say('Selected: '+t)}
function snapshot(){history.push(JSON.stringify(objects));if(history.length>30)history.shift()}
function undo(){if(history.length){objects=JSON.parse(history.pop());render();build3d();say('Undo complete')}}
function resize(){
 const r=canvas.getBoundingClientRect();
 const dpr=window.devicePixelRatio||1;
 canvas.width=r.width*dpr;canvas.height=r.height*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);render()
}
window.addEventListener('resize',resize);
function pos(e){
 const r=canvas.getBoundingClientRect();
 return {x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}
}
function add(type,x,y,w,h){
 snapshot();
 objects.push({id:Date.now()+Math.random(),type,x,y,w,h,
 color:document.getElementById('color').value});
 render();build3d();say(type+' added')
}
function pointerDown(e){
 if(view!=='2d')return;
 e.preventDefault();
 const p=pos(e);
 if(tool==='room'||tool==='wall'){drawing={x:p.x,y:p.y};canvas.setPointerCapture(e.pointerId);return}
 const s=Number(document.getElementById('size').value)||100;
 if(tool==='erase'){
  const i=objects.findLastIndex(o=>p.x>=o.x-8&&p.x<=o.x+o.w+8&&p.y>=o.y-8&&p.y<=o.y+o.h+8);
  if(i>=0){snapshot();objects.splice(i,1);render();build3d();say('Object deleted')}
  return;
 }
 if(tool==='door'||tool==='window'){
  add(tool,p.x-s/2,p.y-8,s,16);return
 }
 add(tool,p.x-s/2,p.y-s/2,s,s)
}
function pointerMove(e){
 if(!drawing)return;
 render();
 const p=pos(e);
 ctx.strokeStyle='#00aaff';ctx.lineWidth=2;
 ctx.strokeRect(ox+drawing.x*scale,oy+drawing.y*scale,
 (p.x-drawing.x)*scale,(p.y-drawing.y)*scale)
}
function pointerUp(e){
 if(!drawing)return;
 const p=pos(e),d=drawing;drawing=null;
 let x=Math.min(p.x,d.x),y=Math.min(p.y,d.y);
 let w=Math.max(20,Math.abs(p.x-d.x)),h=Math.max(20,Math.abs(p.y-d.y));
 snapshot();
 if(tool==='room'){
  objects.push({id:Math.random(),type:'room',x,y,w,h,color:'#203e60'});
  const t=8;
  objects.push(
   {id:Math.random(),type:'wall',x,y,w,h:t,color:'#d5e5ff'},
   {id:Math.random(),type:'wall',x,y:y+h-t,w,h:t,color:'#d5e5ff'},
   {id:Math.random(),type:'wall',x,y,w:t,h,color:'#d5e5ff'},
   {id:Math.random(),type:'wall',x:x+w-t,y,w:t,h,color:'#d5e5ff'}
  );
  say('Room and 4 boundary walls created')
 }else{
  objects.push({id:Math.random(),type:'wall',x,y,w,h,color:'#d5e5ff'});
  say('Wall created')
 }
 render();build3d()
}
canvas.addEventListener('pointerdown',pointerDown);
canvas.addEventListener('pointermove',pointerMove);
canvas.addEventListener('pointerup',pointerUp);

function render(){
 const r=canvas.getBoundingClientRect();
 ctx.clearRect(0,0,r.width,r.height);
 ctx.fillStyle='#081a32';ctx.fillRect(0,0,r.width,r.height);
 ctx.strokeStyle='#163353';ctx.lineWidth=1;
 for(let x=ox%20;x<r.width;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,r.height);ctx.stroke()}
 for(let y=oy%20;y<r.height;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(r.width,y);ctx.stroke()}
 objects.forEach(o=>{
  const x=ox+o.x*scale,y=oy+o.y*scale,w=o.w*scale,h=o.h*scale;
  if(o.type==='room'){
   ctx.fillStyle=o.color;ctx.globalAlpha=.45;ctx.fillRect(x,y,w,h);ctx.globalAlpha=1;
   ctx.fillStyle='#fff';ctx.font='12px Arial';ctx.fillText('ROOM',x+6,y+18)
  }else if(o.type==='wall'){
   ctx.fillStyle=o.color;ctx.fillRect(x,y,w,h)
  }else if(o.type==='door'||o.type==='window'){
   // Symbolic 2D opening marker; not a true wall boolean cut.
   ctx.fillStyle='#081a32';ctx.fillRect(x,y,w,h);
   ctx.strokeStyle=o.type==='door'?'#ffb45d':'#00cfff';ctx.lineWidth=3;
   ctx.strokeRect(x,y,w,h);
   if(o.type==='door'){
    ctx.beginPath();ctx.arc(x,y,w,0,Math.PI/2);ctx.stroke()
   }else{
    ctx.beginPath();ctx.moveTo(x,y+h/2);ctx.lineTo(x+w,y+h/2);ctx.stroke()
   }
  }else{
   ctx.fillStyle=o.color;ctx.strokeStyle='#eaf5ff';ctx.lineWidth=1;
   ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);
   const symbols={light:'💡',switch:'S',socket:'▣',fan:'✥',cabinet:'CAB',bed:'BED',stair:'STAIR'};
   ctx.fillStyle='#fff';ctx.font='12px Arial';
   ctx.fillText(symbols[o.type]||o.type.toUpperCase(),x+3,y+14)
  }
 });
}
function fit(){
 if(!objects.length)return;
 const minX=Math.min(...objects.map(o=>o.x)),minY=Math.min(...objects.map(o=>o.y));
 const maxX=Math.max(...objects.map(o=>o.x+o.w)),maxY=Math.max(...objects.map(o=>o.y+o.h));
 const r=canvas.getBoundingClientRect();
 scale=Math.min((r.width-40)/(maxX-minX||1),(r.height-40)/(maxY-minY||1),2);
 ox=20-minX*scale;oy=20-minY*scale;render()
}
function showView(v){
 view=v;
 canvas.style.display=v==='2d'?'block':'none';
 document.getElementById('view3d').style.display=v==='3d'?'block':'none';
 if(v==='3d'){init3d();build3d()}
}
function init3d(){
 if(renderer)return;
 const host=document.getElementById('view3d');
 if(!window.THREE){say('3D library failed. Check internet connection.');return}
 scene=new THREE.Scene();scene.background=new THREE.Color(0xeaf0f7);
 camera=new THREE.PerspectiveCamera(45,host.clientWidth/Math.max(1,host.clientHeight),.1,10000);
 camera.position.set(250,280,300);camera.lookAt(0,0,0);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(host.clientWidth,host.clientHeight);
 host.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x556677,2));
 const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(100,200,100);scene.add(light);
 modelGroup=new THREE.Group();scene.add(modelGroup);
 function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}
 animate();
 window.addEventListener('resize',()=>{
  if(!renderer)return;
  camera.aspect=host.clientWidth/Math.max(1,host.clientHeight);
  camera.updateProjectionMatrix();renderer.setSize(host.clientWidth,host.clientHeight)
 });
}
function build3d(){
 if(!scene||!modelGroup)return;
 while(modelGroup.children.length)modelGroup.remove(modelGroup.children[0]);
 objects.forEach(o=>{
  let height=20;
  if(o.type==='wall')height=60;
  if(o.type==='room')height=1;
  if(o.type==='door')height=45;
  if(o.type==='window')height=30;
  if(o.type==='stair')height=20;
  const mat=new THREE.MeshStandardMaterial({
   color:o.color||'#b9c8d8',roughness:.8
  });
  const geo=new THREE.BoxGeometry(Math.max(1,o.w),height,Math.max(1,o.h));
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(o.x+o.w/2,height/2,o.y+o.h/2);
  modelGroup.add(mesh)
 });
}
function exportPNG(){
 const a=document.createElement('a');a.download='Eng-CAD-FloorPlan.png';
 a.href=canvas.toDataURL('image/png');a.click()
}
function saveJSON(){
 const b=new Blob([JSON.stringify({app:'Eng CAD Studio Prime',objects},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download='eng-cad-project.json';a.click();URL.revokeObjectURL(a.href)
}
function loadJSON(e){
 const f=e.target.files[0];if(!f)return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{const d=JSON.parse(reader.result);objects=d.objects||[];
   render();build3d();say('Project loaded')
  }catch(err){say('Invalid JSON file')}
 };
 reader.readAsText(f)
}
resize();
</script>
</body>
</html>
