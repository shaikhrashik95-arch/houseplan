
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eng. CAD Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:white;font-family:Arial,sans-serif}
header{background:#087f8c;text-align:center;padding:18px}
header h1{margin:0;font-size:26px}
header p{margin:8px 0 0}
.panel{background:#202938;padding:10px}
.tools{display:flex;flex-wrap:wrap;gap:7px}
button,input{padding:11px;background:#303b4e;color:white;border:1px solid #52627b;border-radius:8px;font-size:15px}
button.active{background:#087f8c;border-color:#5eead4}
h3{font-size:14px;color:#a5f3fc;margin:5px 0 10px}
#status{padding:10px;font-size:13px;color:#a5f3fc}
#stage{height:55vh;min-height:340px;touch-action:none}
canvas{width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<header>
<h1>Eng. CAD Studio</h1>
<p>2D Floor Plan &amp; 3D House Designer</p>
</header>

<div class="panel">
<h3>DESIGNER</h3>
<div class="tools">
<button data-mode="2d" class="active">2D Plan</button>
<button data-mode="3d">Auto 3D</button>
<button data-mode="electrical">Electrical</button>
<button data-mode="plumbing">Plumbing</button>
<button data-mode="furniture">Furniture</button>
<button data-mode="stairs">Staircase</button>
</div>
</div>

<div class="panel">
<h3>DRAWING TOOLS</h3>
<div class="tools" id="tools">
<button data-tool="select" class="active">Select</button>
<button data-tool="wall">Wall</button>
<button data-tool="line">Line</button>
<button data-tool="rect">Rectangle</button>
<button data-tool="circle">Circle</button>
<button data-tool="dimension">Dimension</button>
<button data-tool="door">Door</button>
<button data-tool="window">Window</button>
<button data-tool="light">Light</button>
<button data-tool="fan">Fan</button>
<button data-tool="switch">Switch</button>
<button data-tool="socket">Socket</button>
<button data-tool="db">DB Board</button>
<button data-tool="toilet">Toilet</button>
<button data-tool="basin">Basin</button>
<button data-tool="shower">Shower</button>
<button data-tool="sink">Kitchen Sink</button>
<button data-tool="tank">Water Tank</button>
<button data-tool="pipe">Water Pipe</button>
<button data-tool="bed">Bed</button>
<button data-tool="sofa">Sofa</button>
<button data-tool="table">Table</button>
<button data-tool="chair">Chair</button>
<button data-tool="stairs">Staircase</button>
<button data-tool="erase">Erase</button>
</div>
</div>

<div class="panel tools">
<label>Wall width <input id="ww" type="number" value="8" min="2" max="30" style="width:65px"></label>
<label>Height <input id="wh" type="number" value="60" min="20" max="200" style="width:70px"></label>
<button id="undo">Undo</button>
<button id="redo">Redo</button>
<button id="clear">Clear</button>
<button id="save">Save</button>
<button id="load">Load</button>
<button id="png">Download PNG</button>
<button id="json">Export JSON</button>
</div>

<div id="status">Choose a tool and draw on the grid.</div>
<div id="stage"><canvas id="c"></canvas></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const c=$('c'),ctx=c.getContext('2d'),stage=$('stage');
let W=0,H=0,dpr=1,items=[],undo=[],redo=[];
let tool='select',mode='2d',start=null,preview=null,selected=-1,moving=null;
const colors={
wall:'#f8fafc',line:'#e5e7eb',rect:'#cbd5e1',circle:'#cbd5e1',
dimension:'#f472b6',door:'#fbbf24',window:'#38bdf8',light:'#fde047',
fan:'#facc15',switch:'#fb923c',socket:'#fb923c',db:'#f97316',
toilet:'#67e8f9',basin:'#67e8f9',shower:'#67e8f9',sink:'#67e8f9',
tank:'#60a5fa',pipe:'#38bdf8',bed:'#c4b5fd',sofa:'#c4b5fd',
table:'#d6d3d1',chair:'#d6d3d1',stairs:'#a3e635'
};
function resize(){
let r=stage.getBoundingClientRect();
dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;
c.width=W*dpr;c.height=H*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);draw();
}
window.addEventListener('resize',resize);
function history(){undo.push(JSON.stringify(items));if(undo.length>50)undo.shift();redo=[]}
function say(s){$('status').textContent=s}
function setTool(t){
tool=t;
document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
say('Tool: '+t.toUpperCase());
}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
mode=b.dataset.mode;
document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));
say('Workspace: '+mode.toUpperCase());draw();
});
function pos(e){
let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
return{x:Math.round(x/20)*20,y:Math.round(y/20)*20};
}
function bounds(a){
if(a.x2!==undefined)return{x:Math.min(a.x,a.x2),y:Math.min(a.y,a.y2),w:Math.abs(a.x2-a.x),h:Math.abs(a.y2-a.y)};
return{x:a.x,y:a.y,w:a.w||40,h:a.h||40};
}
function hit(p){
for(let i=items.length-1;i>=0;i--){
let b=bounds(items[i]);
if(p.x>=b.x-10&&p.x<=b.x+b.w+10&&p.y>=b.y-10&&p.y<=b.y+b.h+10)return i;
}return -1;
}
function move(a,dx,dy){
a.x+=dx;a.y+=dy;
if(a.x2!==undefined){a.x2+=dx;a.y2+=dy}
}
c.addEventListener('pointerdown',e=>{
e.preventDefault();c.setPointerCapture(e.pointerId);
if(mode==='3d')return;
let p=pos(e);
if(tool==='select'||tool==='erase'){
let i=hit(p);
if(tool==='erase'&&i>=0){history();items.splice(i,1);draw();return}
selected=i;
if(i>=0)moving={i,last:p,changed:false};
draw();return;
}
start=p;preview={type:tool,x:p.x,y:p.y,x2:p.x,y2:p.y};
});
c.addEventListener('pointermove',e=>{
if(!start&&!moving)return;
let p=pos(e);
if(moving){
let dx=p.x-moving.last.x,dy=p.y-moving.last.y;
if(dx||dy){
if(!moving.changed){history();moving.changed=true}
move(items[moving.i],dx,dy);moving.last=p;draw();
}
}else{preview={type:tool,x:start.x,y:start.y,x2:p.x,y2:p.y};draw()}
});
c.addEventListener('pointerup',e=>{
if(moving){moving=null;return}
if(!start)return;
let p=pos(e),a=start,it;
if(['wall','line','dimension','pipe'].includes(tool)){
it={type:tool,x:a.x,y:a.y,x2:p.x,y2:p.y};
if(tool==='wall')it.width=Number($('ww').value)||8;
}else if(['rect','circle'].includes(tool)){
it={type:tool,x:Math.min(a.x,p.x),y:Math.min(a.y,p.y),w:Math.max(20,Math.abs(p.x-a.x)),h:Math.max(20,Math.abs(p.y-a.y))};
}else it={type:tool,x:a.x,y:a.y,w:40,h:40};
history();items.push(it);selected=items.length-1;
start=null;preview=null;draw();
});
function label(t,x,y){ctx.font='11px Arial';ctx.fillText(t,x,y)}
function item(a,sel=false){
ctx.save();ctx.strokeStyle=colors[a.type]||'white';ctx.fillStyle=ctx.strokeStyle;
ctx.lineWidth=a.type==='wall'?(a.width||8):2;
if(sel){ctx.shadowColor='#22d3ee';ctx.shadowBlur=8}
let x=a.x,y=a.y,w=a.w||40,h=a.h||40;
switch(a.type){
case'wall':case'line':case'dimension':case'pipe':
ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(a.x2,a.y2);ctx.stroke();
if(a.type==='dimension')label(Math.round(Math.hypot(a.x2-x,a.y2-y)/10)+' units',(x+a.x2)/2,(y+a.y2)/2-8);
if(a.type==='pipe')label('PIPE',(x+a.x2)/2,(y+a.y2)/2-5);break;
case'rect':ctx.strokeRect(x,y,w,h);break;
case'circle':ctx.beginPath();ctx.arc(x+w/2,y+h/2,Math.max(3,Math.min(w,h)/2),0,Math.PI*2);ctx.stroke();break;
case'door':case'window':case'switch':case'socket':case'db':case'tank':case'table':case'chair':
ctx.strokeRect(x,y,w,h);label(a.type.toUpperCase(),x,y+h+13);break;
case'light':case'fan':
ctx.beginPath();ctx.arc(x+w/2,y+h/2,w/2,0,Math.PI*2);ctx.stroke();
ctx.beginPath();ctx.moveTo(x+8,y+8);ctx.lineTo(x+w-8,y+h-8);ctx.moveTo(x+w-8,y+8);ctx.lineTo(x+8,y+h-8);ctx.stroke();label(a.type.toUpperCase(),x,y+h+13);break;
case'toilet':case'basin':case'shower':case'sink':
ctx.strokeRect(x,y,w,h);ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w*.3,h*.25,0,0,Math.PI*2);ctx.stroke();label(a.type.toUpperCase(),x,y+h+13);break;
case'bed':case'sofa':
ctx.strokeRect(x,y,w,h);ctx.strokeRect(x+5,y+5,w-10,h-10);label(a.type.toUpperCase(),x,y+h+13);break;
case'stairs':
ctx.strokeRect(x,y,w,h);for(let i=1;i<6;i++){ctx.beginPath();ctx.moveTo(x,y+h*i/6);ctx.lineTo(x+w,y+h*i/6);ctx.stroke()}label('STAIRS',x,y+h+13);break;
}
ctx.restore();
}
function draw3d(){
ctx.save();ctx.translate(W/2,H*.6);
let k=Math.min(W/750,H/500,1);
ctx.scale(k,k);
function iso(x,y,z=0){return{x:(x-y)*.7,y:(x+y)*.35-z*.8}}
let f=[iso(-250,-180),iso(250,-180),iso(250,180),iso(-250,180)];
ctx.fillStyle='#172638';ctx.strokeStyle='#64748b';ctx.beginPath();f.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill();ctx.stroke();
items.filter(a=>a.type==='wall'||a.type==='line').forEach(a=>{
let z=Number($('wh').value)||60;
let p=[iso(a.x-200,a.y-150),iso((a.x2??a.x)-200,(a.y2??a.y)-150),iso((a.x2??a.x)-200,(a.y2??a.y)-150,z),iso(a.x-200,a.y-150,z)];
ctx.fillStyle='#cbd5e1';ctx.strokeStyle='#f8fafc';ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.closePath();ctx.fill();ctx.stroke();
});
ctx.fillStyle='#e2e8f0';ctx.font='14px Arial';ctx.fillText('3D HOUSE PREVIEW',-90,-H*.42/k);
ctx.restore();
}
function draw(){
if(!W||!H)return;ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,W,H);ctx.fillStyle='#0e1725';ctx.fillRect(0,0,W,H);
if(mode==='3d'){draw3d();return}
ctx.strokeStyle='#243144';ctx.lineWidth=1;
for(let x=0;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
for(let y=0;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
items.forEach((a,i)=>item(a,i===selected));
if(preview){ctx.globalAlpha=.65;item(preview);ctx.globalAlpha=1}
}
$('undo').onclick=()=>{if(undo.length){redo.push(JSON.stringify(items));items=JSON.parse(undo.pop());draw()}};
$('redo').onclick=()=>{if(redo.length){undo.push(JSON.stringify(items));items=JSON.parse(redo.pop());draw()}};
$('clear').onclick=()=>{if(confirm('Clear all drawings?')){history();items=[];selected=-1;draw()}};
$('save').onclick=()=>{try{localStorage.setItem('engCAD',JSON.stringify(items));say('Plan saved on this device.')}catch(e){alert('Save failed. Use Export JSON.')}};
$('load').onclick=()=>{let s=localStorage.getItem('engCAD');if(!s){alert('No saved plan found.');return}history();items=JSON.parse(s);draw();say('Plan loaded.')};
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('json').onclick=()=>download(new Blob([JSON.stringify({items},null,2)],{type:'application/json'}),'eng-cad-plan.json');
$('png').onclick=()=>{if(mode==='3d'){alert('Switch to 2D Plan to export a PNG.');return}c.toBlob(b=>{if(b)download(b,'eng-cad-plan.png')})};
resize();
})();
</script>
</body>
</html>
