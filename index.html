
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#071629">
<title>Eng. CAD Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071629;color:#eaf4ff;font:14px Arial,sans-serif}
header{padding:14px;background:#061326;border-bottom:1px solid #294663}
h2{margin:0;color:#00c8e8}
nav,.tools,.bottom{display:flex;gap:7px;flex-wrap:wrap;padding:9px}
button{background:#142b45;color:white;border:1px solid #35516e;border-radius:8px;padding:10px;cursor:pointer}
button:focus,button:active{background:#007b91}
.tools{background:#0c2038;max-height:36vh;overflow:auto}
label{font-size:12px;color:#9bb4cc}
input{width:65px;padding:7px;background:#071629;color:white;border:1px solid #35516e;border-radius:6px}
.workspace{display:grid;grid-template-columns:1fr 1fr;height:53vh;min-height:260px}
.pane{position:relative;min-width:0;overflow:hidden;background:#09192c;border:1px solid #294663}
.pane strong{position:absolute;top:7px;left:8px;z-index:2}
canvas{width:100%;height:100%;display:block;touch-action:none}
#three{width:100%;height:100%;touch-action:none}
.bottom{background:#061326}
#status{color:#8cecff;padding:5px}
@media(max-width:650px){
 .workspace{grid-template-columns:1fr;grid-template-rows:1fr 1fr;height:58vh}
 button{padding:8px;font-size:12px}
 .tools{max-height:30vh}
}
</style>
</head>
<body>
<header><h2>⌂ Eng. CAD Studio</h2><small>2D Plan • 3D House • Electrical • Plumbing</small></header>
<nav>
<button onclick="setTool('select')">Select</button>
<button onclick="setTool('wall')">Wall</button>
<button onclick="setTool('room')">Room</button>
<button onclick="setTool('door')">Door</button>
<button onclick="setTool('window')">Window</button>
<button onclick="setTool('dimension')">Dimension</button>
<button onclick="setTool('light')">Light</button>
<button onclick="setTool('fan')">Fan</button>
<button onclick="setTool('switch')">Switch</button>
<button onclick="setTool('socket')">Socket</button>
<button onclick="setTool('db')">DB Board</button>
<button onclick="setTool('toilet')">Toilet</button>
<button onclick="setTool('basin')">Basin</button>
<button onclick="setTool('shower')">Shower</button>
<button onclick="setTool('sink')">Kitchen Sink</button>
<button onclick="setTool('tank')">Water Tank</button>
<button onclick="setTool('pipe')">Water Pipe</button>
<button onclick="setTool('bed')">Bed</button>
<button onclick="setTool('sofa')">Sofa</button>
<button onclick="setTool('table')">Table</button>
<button onclick="setTool('chair')">Chair</button>
<button onclick="setTool('stair')">Staircase</button>
<button onclick="undo()">Undo</button>
<button onclick="redo()">Redo</button>
<button onclick="clearPlan()">Clear</button>
</nav>
<div class="tools">
<label>Wall width cm <input id="ww" type="number" value="15"></label>
<label>Wall height m <input id="wh" type="number" value="3" step=".1"></label>
<label>Grid cm <input id="gs" type="number" value="25"></label>
<button onclick="save()">Save</button>
<button onclick="load()">Load</button>
<button onclick="png()">Download PNG</button>
<button onclick="exportJSON()">Export JSON</button>
<button onclick="importJSON()">Import JSON</button>
<button onclick="fit()">Fit Plan</button>
<button onclick="rotate3D()">Rotate 3D</button>
</div>
<main class="workspace">
<section class="pane"><strong>2D Floor Plan</strong><canvas id="plan"></canvas></section>
<section class="pane"><strong>3D House Preview</strong><div id="three"></div></section>
</main>
<div id="status">Choose Wall and tap two points to draw a wall.</div>
<div class="bottom"><small>Mobile CAD Designer · Save your work regularly. 3D requires internet.</small></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const c=document.getElementById('plan'),ctx=c.getContext('2d');
const $=id=>document.getElementById(id);
let tool='wall',start=null,rooms=[],walls=[],items=[],dims=[];
let hist=[],future=[],zoom=1,pan={x:0,y:0},drag=null;
let scene,camera,renderer,group,rotating=false;
const colors={door:'#e4b66e',window:'#4cbcff',light:'#ffd75e',fan:'#b3d9ff',
switch:'#ffb15e',socket:'#a9c8ff',db:'#b9a1ff',toilet:'#d4f0ff',
basin:'#d4f0ff',shower:'#7ad6e8',sink:'#7ad6e8',tank:'#68c8b5',
pipe:'#53d7c2',bed:'#e7b88a',sofa:'#c5c9d2',table:'#cda574',
chair:'#b7a080',stair:'#8ba8c6'};
function msg(s){$('status').textContent=s}
function setTool(t){tool=t;start=null;msg('Selected tool: '+t+' — tap or drag on the 2D plan.')}
function saveHistory(){hist.push(JSON.stringify({walls,rooms,items,dims}));if(hist.length>60)hist.shift();future=[]}
function restore(s){let d=JSON.parse(s);walls=d.walls||[];rooms=d.rooms||[];items=d.items||[];dims=d.dims||[];draw();build3D()}
function undo(){if(!hist.length)return;future.push(JSON.stringify({walls,rooms,items,dims}));restore(hist.pop())}
function redo(){if(!future.length)return;hist.push(JSON.stringify({walls,rooms,items,dims}));restore(future.pop())}
function clearPlan(){if(!confirm('Clear the drawing?'))return;saveHistory();walls=[];rooms=[];items=[];dims=[];draw();build3D()}
function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function scale(){return Math.min(c.clientWidth/8,c.clientHeight/6)*zoom}
function xy(p){let s=scale();return{x:c.clientWidth/2+pan.x+p.x*s,y:c.clientHeight/2+pan.y+p.y*s}}
function world(p){let s=scale();return{x:(p.x-c.clientWidth/2-pan.x)/s,y:(p.y-c.clientHeight/2-pan.y)/s}}
function snap(p){let g=Math.max(5,+$('gs').value||25)/100;return{x:Math.round(p.x/g)*g,y:Math.round(p.y/g)*g}}
function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function line(a,b,color,w){let A=xy(a),B=xy(b);ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()}
function draw(){
 ctx.clearRect(0,0,c.clientWidth,c.clientHeight);ctx.fillStyle='#09192c';ctx.fillRect(0,0,c.clientWidth,c.clientHeight);
 let s=scale(),step=Math.max(5,+$('gs').value||25)/100*s;
 if(step>3){ctx.strokeStyle='#132a41';ctx.lineWidth=1;ctx.beginPath();for(let x=(c.clientWidth/2+pan.x)%step;x<c.clientWidth;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,c.clientHeight)}for(let y=(c.clientHeight/2+pan.y)%step;y<c.clientHeight;y+=step){ctx.moveTo(0,y);ctx.lineTo(c.clientWidth,y)}ctx.stroke()}
 rooms.forEach(r=>{let a=xy({x:r.x,y:r.y}),b=xy({x:r.x+r.w,y:r.y+r.h});ctx.fillStyle='#263c4e';ctx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.strokeStyle='#52718b';ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.fillStyle='white';ctx.textAlign='center';ctx.fillText(r.name,(a.x+b.x)/2,(a.y+b.y)/2)});
 walls.forEach(w=>{line(w.a,w.b,'#020811',Math.max(5,(+$('ww').value||15)/100*s+4));line(w.a,w.b,'#f0f5f9',Math.max(2,(+$('ww').value||15)/100*s))});
 items.forEach(o=>{let p=xy(o.p),z=Math.max(7,o.size*s);ctx.save();ctx.translate(p.x,p.y);ctx.strokeStyle=colors[o.type]||'#eaf4ff';ctx.fillStyle=(colors[o.type]||'#eaf4ff')+'55';ctx.lineWidth=2;
 if(o.type==='door'){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(z,0);ctx.arc(0,0,z,0,Math.PI/2);ctx.stroke()}
 else if(o.type==='window'){ctx.fillStyle='#54c8ff';ctx.fillRect(-z/2,-3,z,6)}
 else if(o.type==='bed'||o.type==='sofa'||o.type==='table'||o.type==='chair'||o.type==='stair'||o.type==='tank'||o.type==='sink'||o.type==='toilet'||o.type==='basin'||o.type==='shower'||o.type==='db'){ctx.fillRect(-z/2,-z/2,z,z);ctx.strokeRect(-z/2,-z/2,z,z)}
 else{ctx.beginPath();ctx.arc(0,0,z*.4,0,Math.PI*2);ctx.stroke();ctx.fillStyle='white';ctx.font='10px Arial';ctx.textAlign='center';ctx.fillText(o.type.toUpperCase(),0,3)}
 ctx.restore()});
 dims.forEach(d=>{line(d.a,d.b,'#b8edff',1);let a=xy(d.a),b=xy(d.b);ctx.fillStyle='#b8edff';ctx.textAlign='center';ctx.fillText(Math.hypot(d.b.x-d.a.x,d.b.y-d.a.y).toFixed(2)+' m',(a.x+b.x)/2,(a.y+b.y)/2-6)});
}
function addItem(type,p){saveHistory();let sizes={door:.8,window:1.2,light:.18,fan:.5,bed:1.8,sofa:1.6,table:1,chair:.5,stair:1.2};items.push({type,p,size:sizes[type]||.5});draw();build3D();msg(type+' added')}
c.addEventListener('pointerdown',e=>{
 c.setPointerCapture(e.pointerId);let p=snap(world(pos(e)));
 if(tool==='wall'||tool==='dimension'){if(!start){start=p;msg('Start point set. Tap end point.')}else{saveHistory();(tool==='wall'?walls:dims).push(tool==='wall'?{a:start,b:p}:{a:start,b:p});start=null;draw();build3D()}return}
 if(tool==='room'){drag={a:p,b:p};return}
 if(tool==='select'){drag={pan:true,p:pos(e),old:{...pan}};return}
 addItem(tool,p)
});
c.addEventListener('pointermove',e=>{if(!drag)return;let p=pos(e);if(drag.pan){pan.x=drag.old.x+p.x-drag.p.x;pan.y=drag.old.y+p.y-drag.p.y;draw()}else{drag.b=snap(world(p));draw();let a=xy(drag.a),b=xy(drag.b);ctx.strokeStyle='#00d9f5';ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y)}});
c.addEventListener('pointerup',()=>{if(drag&&!drag.pan&&tool==='room'&&drag.b){let a=drag.a,b=drag.b,x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(a.x-b.x),h=Math.abs(a.y-b.y);if(w>.2&&h>.2){saveHistory();rooms.push({x,y,w,h,name:'Room '+(rooms.length+1)});walls.push({a:{x,y},b:{x:x+w,y}},{a:{x:x+w,y},b:{x:x+w,y:y+h}},{a:{x:x+w,y:y+h},b:{x,y:y+h}},{a:{x,y:y+h},b:{x,y}});build3D()}}drag=null;draw()});
function exportJSON(){let d={walls,rooms,items,dims,wallHeight:+$('wh').value,wallWidth:+$('ww').value};download(JSON.stringify(d,null,2),'eng-cad-project.json','application/json')}
function importJSON(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{saveHistory();restore(r.result);msg('Imported')}catch(e){alert('Invalid JSON file')}};r.readAsText(f)};i.click()}
function download(data,name,type){let b=new Blob([data],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function png(){draw();let a=document.createElement('a');a.download='eng-cad-plan.png';a.href=c.toDataURL('image/png');a.click()}
function save(){try{localStorage.setItem('engCAD',JSON.stringify({walls,rooms,items,dims}));msg('Saved on this device')}catch(e){msg('Save failed')}}
function load(){let d=localStorage.getItem('engCAD');if(d){saveHistory();restore(d);msg('Loaded')}else msg('No saved drawing')}
function fit(){zoom=1;pan={x:0,y:0};draw()}
let scene,camera,renderer,group;
function init3D(){
 if(!window.THREE){$('three').innerHTML='<p>3D needs internet. Reload this page online.</p>';return}
 scene=new THREE.Scene();scene.background=new THREE.Color('#09192c');
 camera=new THREE.PerspectiveCamera(45,1,.1,500);camera.position.set(8,8,10);camera.lookAt(0,0,0);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));$('three').appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x344355,2));
 let light=new THREE.DirectionalLight(0xffffff,2);light.position.set(8,12,8);scene.add(light);
 scene.add(new THREE.GridHelper(25,25,0x28455e,0x152e45));group=new THREE.Group();scene.add(group);
 resize3D();build3D();loop();
 let down=null;renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
 renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-down.x;down={x:e.clientX,y:e.clientY};camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),-dx*.008);camera.lookAt(0,0,0)});
 renderer.domElement.addEventListener('pointerup',()=>down=null);
}
function resize3D(){if(!renderer)return;let w=$('three').clientWidth,h=$('three').clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
function material(color){return new THREE.MeshStandardMaterial({color,roughness:.8})}
function box(x,y,z,w,h,d,color){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(color));m.position.set(x,y,z);m.castShadow=true;group.add(m);return m}
function build3D(){
 if(!group)return;group.clear();
 let pts=[];walls.forEach(w=>pts.push(w.a,w.b));rooms.forEach(r=>pts.push({x:r.x,y:r.y},{x:r.x+r.w,y:r.y+r.h}));items.forEach(o=>pts.push(o.p));
 let minX=pts.length?Math.min(...pts.map(p=>p.x)):-2,maxX=pts.length?Math.max(...pts.map(p=>p.x)):2,minY=pts.length?Math.min(...pts.map(p=>p.y)):-2,maxY=pts.length?Math.max(...pts.map(p=>p.y)):2;
 let cx=(minX+maxX)/2,cy=(minY+maxY)/2,h=Math.max(2,Math.min(5,+$('wh').value||3));
 box(0,-.12,0,Math.max(2,maxX-minX+.3),.2,Math.max(2,maxY-minY+.3),'#526373');
 rooms.forEach(r=>box(r.x+r.w/2-cx,.02,r.y+r.h/2-cy,r.w,.04,r.h,'#d5d2c9'));
 if(!rooms.length)box(0,.02,0,Math.max(2,maxX-minX),.04,Math.max(2,maxY-minY),'#d5d2c9');
 walls.forEach(w=>{let dx=w.b.x-w.a.x,dy=w.b.y-w.a.y,len=Math.hypot(dx,dy),m=box((w.a.x+w.b.x)/2-cx,h/2,(w.a.y+w.b.y)/2-cy,len,h,Math.max(.06,(+$('ww').value||15)/100),'#e8edf0');m.rotation.y=-Math.atan2(dy,dx)});
 items.forEach(o=>{let x=o.p.x-cx,z=o.p.y-cy,s=o.size;
 switch(o.type){
 case'bed':box(x,.2,z,1.5,.25,1.9,'#9b6b43');box(x,.38,z,1.35,.15,1.7,'#e6e6df');break;
 case'sofa':box(x,.3,z,1.6,.5,.7,'#c5c9d2');break;
 case'table':box(x,.65,z,1,.1,.75,'#cda574');break;
 case'chair':box(x,.45,z,.45,.1,.45,'#b7a080');break;
 case'door':box(x,1.05,z,.8,2.1,.08,'#9b6b43');break;
 case'window':box(x,1.7,z,Math.max(.5,s),.8,.06,'#4bbcf4');break;
 case'light':box(x,h-.05,z,.2,.06,.2,'#ffe47a');break;
 case'fan':for(let i=0;i<4;i++){let b=box(x,h-.15,z,.65,.04,.12,'#d8e8f7');b.rotation.y=i*Math.PI/2}break;
 case'toilet':box(x,.25,z,.45,.35,.55,'#f2f6f8');break;
 case'basin':case'sink':box(x,.8,z,.6,.15,.45,'#d9e8ed');break;
 case'shower':box(x,1.2,z,.8,2.3,.05,'#7ad6e8');break;
 case'tank':box(x,.6,z,1,.9,1,'#4b90ba');break;
 case'stair':for(let i=0;i<6;i++)box(x,.12+i*.16,z+i*.24,.9,.12,.24,'#9b6b43');break;
 case'pipe':box(x,.25,z,Math.max(.4,s),.06,.06,'#35bfa5');break;
 default:box(x,1,z,.15,.15,.08,colors[o.type]||'#b9a1ff')
 }
 });
 camera.lookAt(0,0,0);
}
function loop(){requestAnimationFrame(loop);if(rotating&&camera)camera.position.applyAxisAngle(new THREE.Vector3(0,1,0),.005);if(renderer)renderer.render(scene,camera)}
function rotate3D(){rotating=!rotating;msg(rotating?'3D rotation on':'3D rotation off')}
window.addEventListener('resize',()=>{resize();resize3D()});
resize();init3D();
// starter plan
rooms=[{x:-2,y:-2,w:2,h:2,name:'Bedroom'},{x:0,y:-2,w:2,h:2,name:'Kitchen'},{x:-2,y:0,w:2,h:2,name:'Bath'},{x:0,y:0,w:2,h:2,name:'Living'}];
walls=[
{a:{x:-2,y:-2},b:{x:2,y:-2}},{a:{x:-2,y:2},b:{x:2,y:2}},
{a:{x:-2,y:-2},b:{x:-2,y:2}},{a:{x:2,y:-2},b:{x:2,y:2}},
{a:{x:0,y:-2},b:{x:0,y:0}},{a:{x:-2,y:0},b:{x:2,y:0}}
];
items=[{type:'bed',p:{x:-1,y:-1},size:1.8},{type:'table',p:{x:1,y:1},size:1}];
draw();build3D();
</script>
</body>
</html>
