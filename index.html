<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Construction, Electrical & Plumbing CAD Studio</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #toolbar {
            display: flex;
            background: #262626;
            padding: 8px 12px;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #333;
            max-height: 110px;
            overflow-y: auto;
        }
        .category-group {
            display: flex;
            gap: 4px;
            align-items: center;
            border-left: 2px solid #444;
            padding-left: 8px;
        }
        button, select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #444; }
        .tool-active { background: #ffc107 !important; color: #000 !important; border-color: #ffc107; }
        canvas {
            display: block;
            background: #111111;
            cursor: crosshair;
        }
        .label-title {
            font-size: 11px;
            color: #aaa;
            margin-right: 2px;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <h3 style="margin: 0 5px 0 0; font-size: 15px; color: #ffc107;">Eng. CAD Studio</h3>
        
        <!-- সাধারণ ড্রয়িং -->
        <div class="category-group">
            <span class="label-title">General:</span>
            <button id="btn-pen" onclick="setTool('pen')" class="tool-active">পেন</button>
            <button onclick="clearCanvas()" style="background: #d32f2f;">ক্লিয়ার</button>
        </div>

        <!-- কনস্ট্রাকশন আইটেম -->
        <div class="category-group">
            <span class="label-title">Construction:</span>
            <button id="btn-wall" onclick="setTool('wall')">দেওয়াল (Wall)</button>
            <button id="btn-roof" onclick="setTool('roof')">ছাদ (Roof)</button>
            <button id="btn-box3d" onclick="setTool('box3d')">৩D রুম/বক্স</button>
            <button id="btn-window" onclick="setTool('window')">দরজা/জানালা</button>
        </div>

        <!-- ইলেকট্রিক্যাল আইটেম -->
        <div class="category-group">
            <span class="label-title">Electrical:</span>
            <button id="btn-switch" onclick="setTool('switch')">সুইচ/সকেট</button>
            <button id="btn-light" onclick="setTool('light')">লাইট পয়েন্ট</button>
            <button id="btn-db" onclick="setTool('db')">ডিস্ট্রিবিউশন বোর্ড (DB)</button>
        </div>

        <!-- প্লাম্বিং আইটেম -->
        <div class="category-group">
            <span class="label-title">Plumbing:</span>
            <button id="btn-pipe" onclick="setTool('pipe')">প্লাম্বিং পাইপ</button>
            <button id="btn-tap" onclick="setTool('tap')">ট্যাপ/বেসিন</button>
        </div>

        <!-- কালার পিকার -->
        <div class="category-group">
            <input type="color" id="colorPicker" value="#ffc107" style="border:none; width:28px; height:28px; cursor:pointer; background:none;" title="রং পরিবর্তন">
        </div>
    </div>

    <canvas id="paintCanvas"></canvas>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');

        // Fullscreen Setup
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 110;

        let currentTool = 'pen';
        let isDrawing = false;
        let startX, startY;

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('#toolbar button').forEach(b => {
                if(!b.textContent.includes('ক্লিয়ার')) b.classList.remove('tool-active');
            });
            const activeBtn = document.getElementById('btn-' + tool);
            if(activeBtn) activeBtn.classList.add('tool-active');
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
        }

        // CAD Grid Background
        function drawGrid() {
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 1;
            const step = 30;
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        drawGrid();

        // Mouse & Touch Actions
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            startX = e.clientX;
            startY = e.clientY - 110;
            if (currentTool === 'pen') {
                ctx.beginPath();
                ctx.moveTo(startX, startY);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            const currentY = e.clientY - 110;
            const color = document.getElementById('colorPicker').value;
            
            if (currentTool === 'pen') {
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.lineTo(e.clientX, currentY);
                ctx.stroke();
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isDrawing) return;
            isDrawing = false;
            const currentY = e.clientY - 110;
            const color = document.getElementById('colorPicker').value;
            ctx.strokeStyle = color;
            ctx.fillStyle = color;

            if (currentTool === 'wall') {
                // দেওয়াল (Wall Line)
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(e.clientX, currentY);
                ctx.stroke();
            } else if (currentTool === 'roof') {
                // ছাদ (Roof Triangle/Outline)
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(startX, startY + 30);
                ctx.lineTo(startX + (e.clientX - startX) / 2, startY - 20);
                ctx.lineTo(e.clientX, startY + 30);
                ctx.closePath();
                ctx.stroke();
            } else if (currentTool === 'box3d') {
                // ৩D রুম বা বক্স
                ctx.lineWidth = 2;
                let width = e.clientX - startX;
                let height = currentY - startY;
                ctx.strokeRect(startX, startY, width, height);
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX + 25, startY - 25);
                ctx.lineTo(startX + width + 25, startY - 25);
                ctx.lineTo(startX + width, startY);
                ctx.moveTo(startX + width + 25, startY - 25);
                ctx.lineTo(startX + width + 25, startY + height - 25);
                ctx.lineTo(startX + width, startY + height);
                ctx.stroke();
            } else if (currentTool === 'window') {
                // দরজা/জানালা (Window Box)
                ctx.lineWidth = 2;
                ctx.strokeRect(startX, startY, 40, 15);
            } else if (currentTool === 'switch') {
                // ইলেকট্রিক্যাল সুইচ/সকেট সিম্বল
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(e.clientX, currentY, 12, 0, 2 * Math.PI);
                ctx.stroke();
            } else if (currentTool === 'light') {
                // লাইট পয়েন্ট সিম্বল
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(e.clientX, currentY, 14, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.fillText("💡", e.clientX - 6, currentY + 4);
            } else if (currentTool === 'db') {
                // ডিস্ট্রিবিউশন বোর্ড (DB Box)
                ctx.lineWidth = 2;
                ctx.strokeRect(e.clientX - 15, currentY - 20, 30, 40);
            } else if (currentTool === 'pipe') {
                // প্লাম্বিং পাইপ লাইন (Blue/Cyan color)
                ctx.strokeStyle = '#00bcd4';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(e.clientX, currentY);
                ctx.stroke();
            } else if (currentTool === 'tap') {
                // ট্যাপ/বেসিন সিম্বল
                ctx.fillStyle = '#00bcd4';
                ctx.beginPath();
                ctx.arc(e.clientX, currentY, 8, 0, 2 * Math.PI);
                ctx.fill();
            }
        });

        // Window resize handle
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 110;
            drawGrid();
        });
    </script>
</body>
</html>
