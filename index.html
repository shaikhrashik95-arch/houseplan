
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Eng. CAD Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:#f9fafb;font:14px Arial}
header{padding:14px;background:#0b1220;font-size:20px;font-weight:bold}
#tools{display:flex;flex-wrap:wrap;gap:6px;padding:9px;background:#1f2937}
button,.filebtn,select{background:#374151;color:white;border:1px solid #64748b;padding:10px;border-radius:6px}
button.active{background:#087f8c}
input[type=file]{display:none}
#status{padding:7px 10px;color:#a7f3d0;background:#111827}
#board{height:calc(100dvh - 180px);min-height:300px;position:relative;background:#080d17;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
footer{padding:9px;color:#9ca3af;font-size:12px}
</style>
</head>
<body>
<header>Eng. CAD Studio <small style="font-size:11px">2D CAD CORE</small></header>

<div id="tools">
<button data-tool="select" class="active">Select</button>
<button data-tool="line">Line</button>
<button data-tool="rect">Rectangle</button>
<button data-tool="circle">Circle</button>
<button id="gridBtn">Snap: ON</button>
<button id="undoBtn">Undo</button>
<button id="clearBtn">Clear</button>
<button id="saveBtn">Save JSON</button>
<label class="filebtn">Open JSON<input id="openJson" type="file" accept=".json,application/json"></label>
<button id="pngBtn">Export PNG</button>
<button id="dxfBtn">Export DXF</button>
<label class="filebtn">Open DXF<input id="openDxf" type="file" accept=".dxf,text/plain"></label>
</div>

<div id="status">Ready | Units: drawing units | Snap: ON</div>
<div id="board"><canvas id="cad"></canvas></div>
<footer>Draw with touch or mouse. DXF support in this starter: LINE and CIRCLE only. Save your projects regularly.</footer>

<script>
(()=>{
const canvas=document.getElementById('cad');
const ctx=canvas.getContext('2d');
const status=document.getElementById('status');
let objects=[],undoStack=[],tool='select',snap=true;
let start=null,preview=null,selected=null,dragging=false;
let W=1,H=1,DPR=1;

function resize(){
 const r=canvas.getBoundingClientRect();
 W=r.width;H=r.height;
 DPR=Math.min(window.devicePixelRatio||1,2);
 canvas.width=Math.round(W*DPR);
 canvas.height=Math.round(H*DPR);
 ctx.setTransform(DPR,0,0,DPR,0,0);
 render();
}
window.addEventListener('resize',resize);

function point(e){
 const r=canvas.getBoundingClientRect();
 let x=e.clientX-r.left,y=e.clientY-r.top;
 if(snap){x=Math.round(x/20)*20;y=Math.round(y/20)*20}
 return {x,y};
}
function snapshot(){
 undoStack.push(JSON.stringify(objects));
 if(undoStack.length>60)undoStack.shift();
}
function line(a,b,color='#e5e7eb',width=1){
 ctx.strokeStyle=color;ctx.lineWidth=width;
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}
function drawObject(o){
 ctx.strokeStyle=o.id===selected?'#fbbf24':'#e5e7eb';
 ctx.lineWidth=o.id===selected?2:1.5;
 if(o.type==='line'){
  line(o.a,o.b,ctx.strokeStyle,ctx.lineWidth);
 }else if(o.type==='rect'){
  ctx.strokeRect(o.a.x,o.a.y,o.b.x-o.a.x,o.b.y-o.a.y);
 }else if(o.type==='circle'){
  ctx.beginPath();
  ctx.arc(o.a.x,o.a.y,Math.hypot(o.b.x-o.a.x,o.b.y-o.a.y),0,Math.PI*2);
  ctx.stroke();
 }
}
function render(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle='#080d17';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#172235';ctx.lineWidth=0.5;
 for(let x=0;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.strokeStyle='#2b415b';
 for(let x=0;x<W;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=0;y<H;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 objects.forEach(drawObject);
 if(preview)drawObject(preview);
 ctx.fillStyle='#93a4bd';ctx.font='11px Arial';
 ctx.fillText('ENG. CAD STUDIO  |  2D MODEL SPACE',10,H-12);
}
function setTool(t){
 tool=t;start=null;preview=null;
 document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
 status.textContent='Tool: '+t.toUpperCase()+' | Snap: '+(snap?'ON':'OFF');
 render();
}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));

canvas.addEventListener('pointerdown',e=>{
 canvas.setPointerCapture(e.pointerId);
 const p=point(e);
 if(tool==='select'){
  selected=null;
  for(let i=objects.length-1;i>=0;i--){
   const o=objects[i];
   const d=o.type==='circle'
    ?Math.abs(Math.hypot(p.x-o.a.x,p.y-o.a.y)-Math.hypot(o.b.x-o.a.x,o.b.y-o.a.y))
    :Math.min(Math.hypot(p.x-o.a.x,p.y-o.a.y),Math.hypot(p.x-o.b.x,p.y-o.b.y));
   if(d<12){selected=o.id;break}
  }
  render();return;
 }
 if(!start){start=p;preview={type:tool,a:p,b:p};}
 else{
  snapshot();
  objects.push({id:Date.now()+Math.random(),type:tool,a:start,b:p});
  start=null;preview=null;
 }
 render();
});
canvas.addEventListener('pointermove',e=>{
 if(start&&tool!=='select'){preview={type:tool,a:start,b:point(e)};render()}
});
canvas.addEventListener('pointercancel',()=>{start=null;preview=null;render()});

document.getElementById('gridBtn').onclick=()=>{
 snap=!snap;
 document.getElementById('gridBtn').textContent='Snap: '+(snap?'ON':'OFF');
 render();
};
document.getElementById('undoBtn').onclick=()=>{
 if(undoStack.length){objects=JSON.parse(undoStack.pop());selected=null;render()}
};
document.getElementById('clearBtn').onclick=()=>{
 if(objects.length&&!confirm('Clear all drawing objects?'))return;
 snapshot();objects=[];selected=null;render();
};
function download(name,data,type){
 const a=document.createElement('a');
 const url=URL.createObjectURL(new Blob([data],{type}));
 a.href=url;a.download=name;a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.getElementById('saveBtn').onclick=()=>{
 download('eng-cad-project.json',JSON.stringify({
  app:'Eng. CAD Studio',version:1,units:'drawing-units',objects
 },null,2),'application/json');
};
document.getElementById('openJson').onchange=async e=>{
 try{
  const data=JSON.parse(await e.target.files[0].text());
  if(!Array.isArray(data.objects))throw Error('Invalid project');
  if(!data.objects.every(o=>['line','rect','circle'].includes(o.type)&&o.a&&o.b))throw Error('Unsupported object');
  snapshot();objects=data.objects;selected=null;render();
  status.textContent='JSON project loaded';
 }catch(err){alert('Cannot open project: '+err.message)}
 e.target.value='';
};
document.getElementById('pngBtn').onclick=()=>{
 const a=document.createElement('a');
 a.download='eng-cad-drawing.png';a.href=canvas.toDataURL('image/png');a.click();
};
function dxfLine(a,b){
 return `0\nLINE\n8\n0\n10\n${a.x}\n20\n${-a.y}\n30\n0\n11\n${b.x}\n21\n${-b.y}\n31\n0\n`;
}
document.getElementById('dxfBtn').onclick=()=>{
 let s='0\nSECTION\n2\nENTITIES\n';
 for(const o of objects){
  if(o.type==='line')s+=dxfLine(o.a,o.b);
  if(o.type==='rect'){
   const a=o.a,b=o.b;
   s+=dxfLine(a,{x:b.x,y:a.y})+dxfLine({x:b.x,y:a.y},b)+
      dxfLine(b,{x:a.x,y:b.y})+dxfLine({x:a.x,y:b.y},a);
  }
  if(o.type==='circle'){
   s+=`0\nCIRCLE\n8\n0\n10\n${o.a.x}\n20\n${-o.a.y}\n30\n0\n40\n${Math.hypot(o.b.x-o.a.x,o.b.y-o.a.y)}\n`;
  }
 }
 s+='0\nENDSEC\n0\nEOF\n';
 download('eng-cad-drawing.dxf',s,'application/dxf');
};
document.getElementById('openDxf').onchange=async e=>{
 try{
  const s=await e.target.files[0].text();
  const lines=s.replace(/\r/g,'').split('\n').map(x=>x.trim());
  let parsed=[],id=1;
  for(let i=0;i<lines.length-1;i++){
   if(lines[i]!=='0')continue;
   const type=lines[i+1];i++;
   if(!['LINE','CIRCLE'].includes(type))continue;
   let vals={};
   while(i+1<lines.length&&lines[i]!=='0'){
    const code=lines[i],value=lines[i+1];i+=2;
    vals[code]=value;
   }
   if(type==='LINE'&&vals['10']!=null&&vals['11']!=null){
    parsed.push({id:id++,type:'line',
     a:{x:+vals['10'],y:-Number(vals['20']||0)},
     b:{x:+vals['11'],y:-Number(vals['21']||0)}});
   }
   if(type==='CIRCLE'&&vals['10']!=null&&vals['40']!=null){
    const x=+vals['10'],y=-Number(vals['20']||0),r=+vals['40'];
    parsed.push({id:id++,type:'circle',a:{x,y},b:{x:x+r,y}});
   }
  }
  if(!parsed.length)throw Error('No supported LINE or CIRCLE objects found');
  snapshot();objects=parsed;selected=null;render();
  status.textContent='DXF loaded: '+parsed.length+' supported objects';
 }catch(err){alert('DXF import failed: '+err.message)}
 e.target.value='';
};
resize();
})();
</script>
</body>
</html>
