<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Construction, Electrical & Plumbing CAD Studio</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #toolbar {
            display: flex;
            background: #262626;
            padding: 8px 12px;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            border-bottom: 2px solid #333;
            max-height: 110px;
            overflow-y: auto;
        }
        .category-group {
            display: flex;
            gap: 4px;
            align-items: center;
            border-left: 2px solid #444;
            padding-left: 8px;
        }
        button, select {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 6px 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #444; }
        .tool-active { background: #ffc107 !important; color: #000 !important; border-color: #ffc107; }
        canvas {
            display: block;
            background: #111111;
            cursor: crosshair;
        }
        .label-title {
            font-size: 11px;
            color: #aaa;
            margin-right: 2px;
        }
    </style>
</head>
<body>

    <div id="toolbar">
        <h3 style="margin: 0 5px 0 0; font-size: 15px; color: #ffc107;">Eng. CAD Studio</h3>
        
        <!-- সাধারণ ড্রয়িং -->
        <div class="category-group">
            <span class="label-title">General:</span>
            <button id="btn-pen" onclick="setTool('pen')" class="tool-active">পেন</button>
            <button onclick="clearCanvas()" style="background: #d32f2f;">ক্লিয়ার</button>
        </div>

        <!-- কনস্ট্রাকশন আইটেম -->
        <div class="category-group">
            <span class="label-title">Construction:</span>
            <button id="btn-wall" onclick="setTool('wall')">দেওয়াল (Wall)</button>
            <button id="btn-roof" onclick="setTool('roof')">ছাদ (Roof)</button>
            <button id="btn-box3d" onclick="setTool('box3d')">৩D রুম/বক্স</button>
            <button id="btn-window" onclick="setTool('window')">দরজা/জানালা</button>
        </div>

        <!-- ইলেকট্রিক্যাল আইটেম -->
        <div class="category-group">
            <span class="label-title">Electrical:</span>
            <button id="btn-switch" onclick="setTool('switch')">সুইচ/সকেট</button>
            <button id="btn-light" onclick="setTool('light')">লাইট পয়েন্ট</button>
            <button id="btn-db" onclick="setTool('db')">ডিস্ট্রিবিউশন বোর্ড (DB)</button>
        </div>

        <!-- প্লাম্বিং আইটেম -->
        <div class="category-group">
            <span class="label-title">Plumbing:</span>
            <button id="btn-pipe" onclick="setTool('pipe')">প্লাম্বিং পাইপ</button>
            <button id="btn-tap" onclick="setTool('tap')">ট্যাপ/বেসিন</button>
        </div>

        <!-- কালার পিকার -->
        <div class="category-group">
            <input type="color" id="colorPicker" value="#ffc107" style="border:none; width:28px; height:28px; cursor:pointer; background:none;" title="রং পরিবর্তন">
        </div>
    </div>

    <canvas id="paintCanvas"></canvas>

    <script>
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');

        // Fullscreen Setup
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight - 110;

        let currentTool = 'pen';
        let isDrawing = false;
        let startX, startY;

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('#toolbar button').forEach(b => {
                if(!b.textContent.includes('ক্লিয়ার')) b.classList.remove('tool-active');
            });
            const activeBtn = document.getElementById('btn-' + tool);
            if(activeBtn) activeBtn.classList.add('tool-active');
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
        }

        // CAD Grid Background
        function drawGrid() {
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 1;
            const step = 30;
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }
        drawGrid();

canvas.style.touchAction = 'none';

function getPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * canvas.width / rect.width,
        y: (e.clientY - rect.top) * canvas.height / rect.height
    };
}

canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    const p = getPoint(e);
    startX = p.x;
    startY = p.y;
    isDrawing = true;

    if (currentTool === 'pen') {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
    }
});

canvas.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    e.preventDefault();

    const p = getPoint(e);
    const color = document.getElementById('colorPicker').value;

    if (currentTool === 'pen') {
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    }
});

function finishDrawing(e) {
    if (!isDrawing) return;
    const p = getPoint(e);
    isDrawing = false;

    if (currentTool === 'wall') {
        ctx.strokeStyle = document.getElementById('colorPicker').value;
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    }
}

canvas.addEventListener('pointerup', finishDrawing);
canvas.addEventListener('pointercancel', () => {
    isDrawing = false;
});
        
        

        // Window resize handle
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight - 110;
            drawGrid();
        });
    </script>
</body>
</html>
